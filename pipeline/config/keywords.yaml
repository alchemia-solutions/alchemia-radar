  - '"computer-aided drug design"'
  - '"generative chemistry" AI'
  - '"protein design" AI'
  - '"de novo drug design"'
  - '"antibody engineering" AI'
  - '"virtual screening" AI pharma'
  - '"AlphaFold" drug discovery'
  - '"AI vaccine design"'
  - '"molecular docking" AI'
  # 2026-10-14: os dois temas pedidos pelo fundador como busca propria (a rotacao por empresa nao os pega).
  - '"virtual cell" AI'
  - '"AI drug design"'
