# Empresas e instituições monitoradas -- página "Empresas" do dashboard.
# method: "rss" (feed real, confirmado ao vivo) | "google_news" (fallback via busca, quando o
# site não expõe RSS público estável, ou quando o feed real existe mas é ruído demais sem query).
# filter_relevance: quando true, o item só entra se casar com pipeline/config/keywords.yaml
# (usado para players grandes cujo conteúdo não é 100% do nicho). Quando false, todo item do
# feed/query entra (empresas cujo negócio inteiro já é o nicho).
#
# category usada para agrupar/filtrar na página Empresas:
#   ai_drug_discovery | cadd_platform | biotech_ai | big_tech_ai | br_institution | bioinformatics_resource

#
# 2026-10-14 -- MARCAS DO MAPA POR FASE (pedido do fundador; relatorios
# alchemia-ai/ai-engineering/docs/descoberta-agentes-por-fase/04a-empresas-in-silico.md e
# 04b-empresas-lab-e-clinica.md, lidos em site oficial em 2026-10-14). Campos opcionais, lidos so por
# quem quiser filtrar (o coletor e o System ignoram; o catalogo no banco guarda a entrada inteira como
# jsonb; o espelho do Supabase tem colunas fixas e NAO leva estes campos). O vocabulario e imposto por
# pipeline/tests/test_config_empresas.py, nos dois sentidos:
#   fase:  lista de aurora | dry-lab | workbench | wet-lab | clinical-trials | the-cure
#          (a fase que o relatorio atribui; virtual cell nao e fase: fica em `temas`)
#   missao: lista de athanor | aurora | workbench, SO quando o relatorio a atribui (lista vazia = o
#          relatorio nao atribuiu; nada foi inferido)
#   tipo:  lista de concorrente | ferramenta | fonte-de-dado | referencia | parceiro | cro
#   temas: opcional; virtual-cell | ai-drug-design, so onde o relatorio os liga a empresa
#   a_confirmar: o que o relatorio diz "nao confirmado" para a empresa (licenca, preco, produto...);
#          nada disso foi tratado como fato. Empresa inteira "nao confirmada" NAO entra aqui.
#   registro_trial: NCT resolvidos no ClinicalTrials.gov pela 04b em 2026-10-14. Nenhum coletor os
#          le ainda (ver "Pendencias do mapa por fase" em sources.yaml); status muda, leia no registro.
#   relatorio: 04a, 04b ou 04a+04b -- onde a empresa foi lida.
#   nota: risco de claim, de LGPD ou de licenca que o relatorio registra.
# Tipo e fase sao julgamento nosso nos relatorios, nao afirmacao da empresa. Nenhuma entrada diz que a
# Alchemia e melhor, maior ou equivalente a ninguem. Uma entrada = um metodo; por isso o blog de Rowan
# e o de DeepMind tem slug proprio (-blog) ao lado da entrada por Google News.
#   Chave `a_acompanhar` (no fim do arquivo): empresas SEM COLETA (acesso bloqueado ou fonte nao confirmada),
#   com `situacao`. Nenhum coletor a le; o teste impede que um slug dela entre em `companies` por engano.

